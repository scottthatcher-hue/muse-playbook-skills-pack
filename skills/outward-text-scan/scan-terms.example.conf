# scan-terms.example.conf — copy to scan-terms.conf and replace EVERY term
# with your own. These placeholders show the SHAPE of a real config; they
# are deliberately generic. Terms are grep extended regexes, one per line.
#
# [fail] terms must never appear in outward text. Any hit blocks the draft.
# [warn] terms are counted for a human look; they do not block by themselves.
#
# Keep your real scan-terms.conf out of version control (see .gitignore):
# a FAIL list is, by definition, a list of things you don't say in public.

[fail]
# Your assistant's internal house name or codename — public text uses the
# professional name only. Replace HOUSECODENAME with yours.
HOUSECODENAME

[warn]
# A banned numeric claim, e.g. an experience or size figure you never state:
[0-9]+[ -]?years?
# Its spelled-out variant:
twenty-five|Twenty-five
# A spelling your style guide fixes one way:
résumé
# Internal jargon that must not leak into external writing:
decision layer
# A name or brand that must never be shortened:
\bShortName\b
# Superseded substitute phrasings you have retired:
a lifetime|decades
